<!DOCTYPE html>

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#dfc8c8;
            display:flex;
            justify-content:center;
            padding:40px;
        }

        #todo{
            width:400px;
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        input{
            width:70%;
            padding:8px;
            border:1px solid #ccc;
            border-radius:4px;
            margin-right:8px;
        }

        button{
            padding:8px 14px;
            border:none;
            border-radius:4px;
            cursor:pointer;
            background:#007bff;
            color:white;
            margin:3px;
        }

        button:hover{
            background:#0056b3;
        }

        #todo div{
            margin-top:12px;
        }

        p{
            display:inline-block;
            width:180px;
            word-break:break-word;
        }
    </style>
</head>
</head>
<body>
    <div id="todo"></div>
    <script src="todo.js"></script>
    
</body>
</html>
